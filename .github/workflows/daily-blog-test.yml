name: Daily blog tests
on:
  pull_request:
    paths: ['scripts/daily-blog/**', '.github/workflows/daily-blog*.yml']
  push:
    branches: ['work/daily-blog-actions']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_GATEWAY_ROUTING_FILE: ${{ github.workspace }}/llm-gateway/config/routing.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: RuizhangZhou/llm-gateway
          ref: eeed89c95a317f279494fa27c0c44dfe5712d791
          path: llm-gateway
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install ./llm-gateway -r scripts/daily-blog/requirements.txt
      - run: python -m unittest discover -s scripts/daily-blog/tests -v
      - run: python -c 'from llm_gateway._config import get_config; assert get_config()["task_routing"]["blog"]; print("Shared gateway imports and routing loads without root access")'
      - run: python -m compileall -q scripts/daily-blog
