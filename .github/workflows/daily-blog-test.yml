name: Daily blog tests
on:
  pull_request:
    paths: ['scripts/daily-blog/**', '.github/workflows/daily-blog*.yml']
  push:
    branches: ['work/daily-blog-actions']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/daily-blog/requirements.txt
      - run: python -m unittest discover -s scripts/daily-blog/tests -v
      - run: python -m compileall -q scripts/daily-blog
